# Qoder Terminal gateway: static SPA + reverse proxy to the three backend services (production)
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Per-branch frontend previews (deploy.sh preview <branch>): /opt/qoder-terminal/previews is mounted read-only
    # at /usr/share/nginx/preview, so /preview/<slug>/... maps to <slug>/... under that mount. Each preview falls back
    # to its own index.html (never to the production SPA); an unknown slug is a 404.
    # Anything under /preview/ that is not a valid slug is a 404, never the production SPA
    location /preview/ { return 404; }
    location ~ "^/preview/[a-z0-9-]{1,40}/assets/" {
        root /usr/share/nginx;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ "^/preview/(?<preview_slug>[a-z0-9-]{1,40})/" {
        root /usr/share/nginx;
        add_header Cache-Control "no-cache";
        try_files $uri /preview/$preview_slug/index.html =404;
    }

    location /api/data/ {
        proxy_pass http://data:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
    }

    location /api/analyst/ {
        proxy_pass http://analyst:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # SSE: disable buffering and compression so events arrive one by one
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location /api/user/ {
        proxy_pass http://user:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
