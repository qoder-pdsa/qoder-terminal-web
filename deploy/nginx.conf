# Qoder Terminal gateway: static SPA + reverse proxy to the three backend services (production)
# Routes live in nginx-locations.conf (installed as /etc/nginx/qt-locations.conf).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# HTTPS for qoder.live: server blocks installed on the host in /opt/qoder-terminal/tls once certificates exist
# (templates in deploy/tls/). Nothing matches before that, so a fresh host serves plain HTTP only.
include /etc/nginx/qt-tls/*.server.conf;

server {
    listen 80 default_server;
    server_name _;
    # Once TLS is enabled this redirects qoder.live / www.qoder.live to https (IP and 127.0.0.1 access stay on HTTP)
    include /etc/nginx/qt-tls/*.redirect.conf;
    include /etc/nginx/qt-locations.conf;
}
