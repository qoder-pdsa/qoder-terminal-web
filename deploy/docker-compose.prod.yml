# 生产部署（阿里云 qoder-terminal-app）。由 deploy/deploy.sh 调用，勿直接手工 up。
# 目录约定：/opt/qoder-terminal/src/<repo>，本文件位于 qoder-terminal-web/deploy/
# 凭证：/etc/qoder-terminal/qoder-terminal.env（600，不入库）
name: qoder-terminal

x-env: &env
  env_file:
    - ${QT_ENV_FILE:-/etc/qoder-terminal/qoder-terminal.env}
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *env
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qoder
      POSTGRES_USER: qoder
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "qoder"]
      interval: 5s
      retries: 20

  # 仅在数据库变更步骤显式执行：deploy.sh db-migrate（服务启动不会触发迁移）
  user-migrate:
    <<: *env
    profiles: [migrate]
    restart: "no"
    image: qoder-terminal/user:${QT_VERSION:-latest}
    command: ["--spring.profiles.active=migrate"]
    environment: &userdb
      USER_DB_URL: jdbc:postgresql://postgres:5432/qoder
      USER_DB_USERNAME: qoder
    depends_on:
      postgres: { condition: service_healthy }

  user:
    <<: *env
    build: ../../qoder-terminal-user
    image: qoder-terminal/user:${QT_VERSION:-latest}
    environment: *userdb
    depends_on:
      postgres: { condition: service_healthy }

  data:
    <<: *env
    build: ../../qoder-terminal-data
    image: qoder-terminal/data:${QT_VERSION:-latest}

  analyst:
    <<: *env
    build: ../../qoder-terminal-analyst
    image: qoder-terminal/analyst:${QT_VERSION:-latest}
    environment:
      DATA_BASE_URL: http://data:8081
    depends_on: [data]

  web:
    <<: *env
    build:
      context: ..
      args:
        VITE_DATA_URL: /api/data
        VITE_ANALYST_URL: /api/analyst
    image: qoder-terminal/web:${QT_VERSION:-latest}
    ports:
      - "${QT_HTTP_PORT:-80}:80"
    depends_on: [data, analyst, user]

volumes:
  pgdata:
