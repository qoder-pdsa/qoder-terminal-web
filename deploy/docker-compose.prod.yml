# Production deployment (Alibaba Cloud qoder-terminal-app). Invoked by deploy/deploy.sh; do not run `up` by hand.
# Layout: /opt/qoder-terminal/src/<repo>; this file lives in qoder-terminal-web/deploy/
# Credentials: /etc/qoder-terminal/qoder-terminal.env (mode 600, never committed)
name: qoder-terminal

x-env: &env
  env_file:
    - ${QT_ENV_FILE:-/etc/qoder-terminal/qoder-terminal.env}
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    <<: *env
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qoder
      POSTGRES_USER: qoder
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "qoder"]
      interval: 5s
      retries: 20

  # Run explicitly only in the database change step: deploy.sh db-migrate (starting services never migrates)
  user-migrate:
    <<: *env
    profiles: [migrate]
    restart: "no"
    image: qoder-terminal/user:${QT_VERSION:-latest}
    command: ["--spring.profiles.active=migrate"]
    environment: &userdb
      USER_DB_URL: jdbc:postgresql://postgres:5432/qoder
      USER_DB_USERNAME: qoder
    depends_on:
      postgres: { condition: service_healthy }

  user:
    <<: *env
    build: ../../qoder-terminal-user
    image: qoder-terminal/user:${QT_VERSION:-latest}
    environment: *userdb
    depends_on:
      postgres: { condition: service_healthy }

  data:
    <<: *env
    build: ../../qoder-terminal-data
    image: qoder-terminal/data:${QT_VERSION:-latest}

  analyst:
    <<: *env
    build: ../../qoder-terminal-analyst
    image: qoder-terminal/analyst:${QT_VERSION:-latest}
    environment:
      DATA_BASE_URL: http://data:8081
    depends_on: [data]

  web:
    <<: *env
    build:
      context: ..
      args:
        VITE_DATA_URL: /api/data
        VITE_ANALYST_URL: /api/analyst
    image: qoder-terminal/web:${QT_VERSION:-latest}
    ports:
      - "${QT_HTTP_PORT:-80}:80"
      - "${QT_HTTPS_PORT:-443}:443"
    volumes:
      # HTTPS: certbot state, ACME webroot and the enabled TLS server blocks (see deploy.sh tls-enable)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/acme:/var/www/acme:ro
      - ${QT_ROOT:-/opt/qoder-terminal}/tls:/etc/nginx/qt-tls:ro
      # Per-branch frontend previews published by deploy.sh preview <branch>, served at /preview/<slug>/
      - ${QT_PREVIEWS:-/opt/qoder-terminal/previews}:/usr/share/nginx/preview:ro
    depends_on: [data, analyst, user]

volumes:
  pgdata:
