# Included inside the port-80 server: send qoder.live / www.qoder.live to HTTPS, except ACME challenges.
# Requests by IP or to 127.0.0.1 (health checks, QA over the private network) keep working on HTTP, and a
# request already terminated as HTTPS by an upstream proxy (X-Forwarded-Proto: https) must not be redirected
# again — that would loop forever.
set $qt_https_redirect "";
if ($host ~* ^(www\.)?qoder\.live$) { set $qt_https_redirect 1; }
if ($http_x_forwarded_proto = "https") { set $qt_https_redirect ""; }
if ($uri ~ ^/\.well-known/acme-challenge/) { set $qt_https_redirect ""; }
if ($qt_https_redirect) { return 301 https://qoder.live$request_uri; }
