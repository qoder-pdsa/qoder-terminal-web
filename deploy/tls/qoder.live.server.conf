# HTTPS for qoder.live — copied to /opt/qoder-terminal/tls/ by `deploy.sh tls-enable` after certbot has issued the certificate
server {
    listen 443 ssl;
    http2 on;
    server_name qoder.live;
    ssl_certificate     /etc/letsencrypt/live/qoder.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qoder.live/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:qt_tls:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/qt-locations.conf;
}

# www.qoder.live → qoder.live
server {
    listen 443 ssl;
    http2 on;
    server_name www.qoder.live;
    ssl_certificate     /etc/letsencrypt/live/qoder.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qoder.live/privkey.pem;
    return 301 https://qoder.live$request_uri;
}
