# Shared routes of the Qoder Terminal gateway, included by every server block (HTTP and HTTPS)
# so production, previews and the API proxy behave the same on both ports.

# Let's Encrypt HTTP-01 challenges (host /var/www/acme is mounted read-only)
location /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }

root /usr/share/nginx/html;

location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
}

# Per-branch frontend previews (deploy.sh preview <branch>): /opt/qoder-terminal/previews is mounted read-only
# at /usr/share/nginx/preview, so /preview/<slug>/... maps to <slug>/... under that mount. Each preview falls back
# to its own index.html (never to the production SPA); an unknown slug is a 404.
# Anything under /preview/ that is not a valid slug is a 404, never the production SPA
location /preview/ { return 404; }
location ~ "^/preview/[a-z0-9-]{1,40}/assets/" {
    root /usr/share/nginx;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location ~ "^/preview/(?<preview_slug>[a-z0-9-]{1,40})/" {
    root /usr/share/nginx;
    add_header Cache-Control "no-cache";
    try_files $uri /preview/$preview_slug/index.html =404;
}

location /api/data/ {
    proxy_pass http://data:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_http_version 1.1;
}

location /api/analyst/ {
    proxy_pass http://analyst:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    # SSE: disable buffering and compression so events arrive one by one
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
}

location /api/user/ {
    proxy_pass http://user:8084/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
}
