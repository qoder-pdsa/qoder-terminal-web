# 四个 repo 需为同级目录。真实行情：DATA_PROVIDER=longbridge docker compose up --build
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qoder
      POSTGRES_USER: qoder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qoder}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "qoder"]
      interval: 3s
      retries: 20

  # 本地编排便利：一次性执行迁移后退出。
  # 真实部署中迁移由 AutoWonder QA 数据库步骤单独执行（先备份），不随部署自动运行。
  user-migrate:
    build: ../qoder-terminal-user
    command: ["--spring.profiles.active=migrate"]
    environment: &user-db
      USER_DB_URL: jdbc:postgresql://postgres:5432/qoder
      USER_DB_USERNAME: qoder
      USER_DB_PASSWORD: ${POSTGRES_PASSWORD:-qoder}
    depends_on:
      postgres: { condition: service_healthy }

  user:
    build: ../qoder-terminal-user
    ports: ["8084:8084"]
    environment:
      <<: *user-db
      USER_JWT_PRIVATE_KEY: ${USER_JWT_PRIVATE_KEY:-}
      USER_JWT_ALLOW_EPHEMERAL: ${USER_JWT_ALLOW_EPHEMERAL:-true}
      USER_INVITE_CODE: ${USER_INVITE_CODE:-demo-invite}
    depends_on:
      user-migrate: { condition: service_completed_successfully }

  data:
    build: ../qoder-terminal-data
    ports: ["8081:8081"]
    environment:
      DATA_PROVIDER: ${DATA_PROVIDER:-mock}
      LONGBRIDGE_APP_KEY: ${LONGBRIDGE_APP_KEY:-}
      LONGBRIDGE_APP_SECRET: ${LONGBRIDGE_APP_SECRET:-}
      LONGBRIDGE_ACCESS_TOKEN: ${LONGBRIDGE_ACCESS_TOKEN:-}
      HTTPS_PROXY: ${DATA_HTTPS_PROXY:-}

  analyst:
    build: ../qoder-terminal-analyst
    ports: ["8082:8082"]
    environment:
      DATA_BASE_URL: http://data:8081
      LLM_PROVIDER: ${LLM_PROVIDER:-stub}
    depends_on: [data]

  web:
    build: .
    ports: ["5173:80"]
    depends_on: [data, analyst, user]

volumes:
  pgdata:
